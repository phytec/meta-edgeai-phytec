# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "edgeai-phytec"
BBFILE_PATTERN_edgeai-phytec := "^${LAYERDIR}/"

# We keep the priority higher than all others
BBFILE_PRIORITY_edgeai-phytec = "13"

LAYERDEPENDS_edgeai-phytec = " \
    core \
    meta-ti-bsp \
    meta-ti-extras \
    meta-arago-distro \
    meta-arago-extras \
    meta-arago-test \
    meta-ti-foundational \
"

LAYERSERIES_COMPAT_edgeai-phytec = "scarthgap"

LAYERRECOMMENDS_edgeai-phytec = " \
    qt6-layer \
    selinux \
"

BBFILES_DYNAMIC += " \
    selinux:${LAYERDIR}/dynamic-layers/selinux/recipes*/*/*.bbappend \
"

# Disable GBM in gstreamer
PACKAGECONFIG:remove:pn-gstreamer1.0-plugins-base = " gbm"

require conf/distro/include/branding-core.inc
require conf/distro/include/edgeai-source-ipk.inc
