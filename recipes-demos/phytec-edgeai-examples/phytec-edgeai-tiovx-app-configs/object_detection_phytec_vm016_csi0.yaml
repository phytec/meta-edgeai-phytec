title: Object Detection phyCAM VM-016
inputs:
    input0:
        source: LINUX_CAM
        width: 1280
        height: 800
        sensor-name: ar0144_12bit
        device: /dev/video-csi0
        subdev: /dev/cam-csi0
        ldc: False
models:
    model0:
        model_path: /opt/model_zoo/ONR-OD-8200-yolox-nano-lite-mmdet-coco-416x416
        viz-threshold: 0.6
outputs:
    output0:
        sink: LINUX_DISPLAY
        width: 1280
        height: 1024
    output1:
        sink: H264_ENCODE
        width: 1920
        height: 1080
        output_path: /root/output/output_video0.h264
    output2:
        sink: IMG_DIR
        width: 1920
        height: 1080
        output_path: /root/output/
flows:
    flow0:
        pipeline: [input0,model0,output1]
        mosaic:
            - [0,150,1280,720]
